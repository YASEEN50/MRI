<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مركز Pi — MRI</title>
  <link rel="stylesheet" href="/pi-login.css?v=2" />
</head>
<body class="pi-auth-page">
  <div class="pi-auth-medical" aria-hidden="true"></div>
  <div class="pi-auth-scrim" aria-hidden="true"></div>
  <div class="pi-auth-bg"></div>
  <div class="pi-auth-glow"></div>

  <div class="pi-auth-wrap">
    <div class="pi-auth-brand">
      <h1 class="pi-auth-title">MRI</h1>
      <p class="pi-auth-subtitle">مصادقة Pi Network</p>
    </div>

    <div class="pi-auth-card">
      <h2>الدخول والتسجيل</h2>
      <p class="pi-auth-hint" id="accountLine">جاري التحقق من حسابك...</p>

      <a href="/pi-app.html" class="pi-auth-btn pi-auth-btn-pi" style="margin-top:16px">π Pi — لوحة الدخول</a>
      <a href="/login" class="pi-auth-btn pi-auth-btn-outline" style="margin-top:10px">تسجيل الدخول</a>
      <a href="/register" class="pi-auth-btn pi-auth-btn-outline" style="margin-top:10px">إنشاء حساب جديد</a>

      <div class="pi-auth-trust" style="margin-top:16px">
        <span>🔒 Pi فقط</span>
        <span>🟣 Pi Network</span>
      </div>
    </div>

    <a class="pi-auth-back pi-auth-text-center" href="/" style="display:block;margin-top:12px">← الرئيسية</a>
  </div>

  <script>
  fetch('/api/auth/account-status', { credentials: 'include', cache: 'no-store' })
    .then(function (r) { return r.json() })
    .then(function (res) {
      var s = res.data || res
      var el = document.getElementById('accountLine')
      if (!s.authenticated) {
        el.textContent = 'غير مسجّل — سجّل الدخول عبر Pi'
        return
      }
      var label = s.piUsername ? '@' + s.piUsername : (s.email || s.userId.slice(0, 8))
      el.textContent = 'مسجّل: ' + label
    })
    .catch(function () {
      document.getElementById('accountLine').textContent = 'سجّل الدخول عبر Pi Network'
    })
  </script>
</body>
</html>
