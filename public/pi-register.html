<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إنشاء حساب — MRI</title>
  <link rel="stylesheet" href="/pi-login.css?v=3" />
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="/pi-auth.js"></script>
</head>
<body class="pi-auth-page">
  <div class="pi-auth-medical" aria-hidden="true"></div>
  <div class="pi-auth-scrim" aria-hidden="true"></div>
  <div class="pi-auth-bg"></div>
  <div class="pi-auth-glow"></div>
  <div class="pi-auth-glow-orb"></div>

  <div class="pi-auth-wrap">
    <div class="pi-auth-brand">
      <div class="pi-auth-logo" aria-hidden="true">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
      </div>
      <h1 class="pi-auth-title">MRI</h1>
      <p class="pi-auth-subtitle">إنشاء حساب عبر Pi Network</p>
    </div>

    <div class="pi-auth-card">
      <h2>انضم إلى المنصة</h2>
      <p class="pi-auth-hint">اختر نوع حسابك ثم وافق على المصادقة في Pi</p>

      <label class="pi-auth-label" for="role">نوع الحساب</label>
      <select id="role" class="pi-auth-select">
        <option value="CLIENT">مريض / عميل</option>
        <option value="DOCTOR">طبيب</option>
        <option value="FACILITY">منشأة طبية</option>
      </select>

      <button id="registerBtn" type="button" class="pi-auth-btn pi-auth-btn-pi" style="margin-top:16px">
        <span>π</span> إنشاء حساب بـ Pi
      </button>

      <div class="pi-auth-trust">
        <span>🔒 Pi فقط</span>
        <span>✓ موثوق</span>
      </div>
    </div>

    <p id="err" class="pi-auth-error"></p>
    <a class="pi-auth-footer-link" href="/login">لديك حساب؟ <strong style="color:var(--pi-accent)">تسجيل الدخول</strong></a>
    <a class="pi-auth-back pi-auth-text-center" href="/" style="display:block">← العودة للرئيسية</a>
  </div>

  <script>
  (function () {
    var btn = document.getElementById('registerBtn')
    var errEl = document.getElementById('err')
    var roleEl = document.getElementById('role')

    btn.addEventListener('click', function () {
      errEl.textContent = ''
      btn.disabled = true
      btn.innerHTML = '<span class="pi-auth-spinner"></span> جاري الإنشاء...'
      window.PiAuth.signUp(roleEl.value).catch(function (e) {
        errEl.textContent = e.message || 'حدث خطأ'
        btn.disabled = false
        btn.innerHTML = '<span>π</span> إنشاء حساب بـ Pi'
      })
    })
  })()
  </script>
</body>
</html>
